# fly.toml app configuration file generated for media-downloader-uge-da on 2026-01-07T16:56:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'media-downloader-uge-da'
primary_region = 'nrt'

[build]
  dockerfile = "backend/Dockerfile"
  build_context = "backend"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 3001
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[experimental]
  auto_rollback = true
